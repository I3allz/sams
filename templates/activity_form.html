{% extends 'base.html' %}
{% block title %}{{ 'แก้ไข' if a else 'เพิ่ม' }}กิจกรรม{% endblock %}
{% block body %}
<h1>{{ '✏️ แก้ไขกิจกรรม' if a else '➕ เพิ่มกิจกรรมใหม่' }}</h1>
<form class="card form" method="post">
  <div class="full"><label>ชื่อกิจกรรม</label><input name="activity_name" required value="{{ a.activity_name if a }}"></div>
  <div><label>ประเภท</label><select name="type_id">{% for t in types %}<option value="{{ t.type_id }}" {{ 'selected' if a and a.type_id == t.type_id }}>{{ t.type_name }}</option>{% endfor %}</select></div>
  <div><label>ปีการศึกษา/ภาคเรียน</label><select name="year_id">{% for y in years %}<option value="{{ y.year_id }}" {{ 'selected' if a and a.year_id == y.year_id }}>{{ y.year_name }} / {{ y.semester }}</option>{% endfor %}</select></div>
  <div><label>สถานที่</label><input name="location" value="{{ a.location if a }}"></div>
  <div><label>วันที่</label><input type="date" name="activity_date" required value="{{ a.activity_date if a }}"></div>
  <div><label>เวลาเริ่ม</label><input type="time" name="start_time" value="{{ a.start_time if a else '08:00' }}"></div>
  <div><label>เวลาสิ้นสุด</label><input type="time" name="end_time" value="{{ a.end_time if a else '16:00' }}"></div>
  <div><label>จำนวนที่รับสูงสุด</label><input type="number" min="1" name="max_participants" value="{{ a.max_participants if a else 50 }}"></div>
  <div><label>ชั่วโมงกิจกรรม</label><input type="number" step="0.5" min="0" name="hours" value="{{ a.hours if a else 1 }}"></div>
  <div class="full row"><button class="btn lg">💾 บันทึก</button><a class="btn sec" href="{{ url_for('activities') }}">ยกเลิก</a></div>
</form>
{% endblock %}
